<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Kalana Didulanga Koralegedara (KayD). I build software that runs real businesses.">
<style>
  .up { animation: up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .draw { stroke-dasharray: 1; animation: draw 1.3s cubic-bezier(0.22, 1, 0.36, 1) 1s both; }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .up, .draw, .caret { animation: none; } .moving { display: none; } }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/></pattern>
  <radialGradient id="fade" cx="70%" cy="45%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridmask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx="80%" cy="40%" r="42%"><stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <linearGradient id="serif" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="268"><stop offset="0.15" stop-color="#fafafa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="1050" y1="0" x2="1170" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0.4"/></linearGradient>
  <linearGradient id="inbeam" gradientUnits="userSpaceOnUse" x1="880" y1="0" x2="930" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="400" fill="#09090b"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="rgba(255,255,255,0.12)"/>

<g class="up" style="animation-delay: 0.05s">
  <rect x="64" y="103" width="22" height="1.5" fill="#34d399"/>
  <text x="98" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#85858f">KALANA DIDULANGA KORALEGEDARA · KAYD</text>
</g>
<text class="up" style="animation-delay: 0.15s" x="62" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#fafafa">I build software</text>
<text class="up" style="animation-delay: 0.3s" x="62" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#fafafa">that <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="66" letter-spacing="-1" fill="url(#serif)">runs real businesses.</tspan></text>
<text class="up" style="animation-delay: 0.45s" x="64" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">Full stack software engineer. Web platforms, mobile apps and Windows software.</text>
<g class="up" style="animation-delay: 0.6s">
  <text x="64" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a1a1aa"><tspan fill="#34d399">~</tspan> now: TwinCoreTech Ltd · C-Lento · freelance since 2023<tspan class="caret" fill="#34d399" font-weight="700"> _</tspan></text>
</g>

<g class="up" style="animation-delay: 0.7s">
  <path d="M880 210 H930" stroke="url(#inbeam)" stroke-width="1.5"/>
  <rect x="930" y="168" width="120" height="84" rx="10" fill="#121215" stroke="rgba(255,255,255,0.12)"/>
  <path d="M930 186 H1050" stroke="rgba(255,255,255,0.12)"/>
