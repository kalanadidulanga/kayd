  <rect x="942" y="237" width="26" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
</g>

<g fill="none" stroke-linecap="round">
  <g filter="url(#soft)" stroke="url(#beam)" stroke-width="6" opacity="0.45"><path d="M1050 210 C1110 210 1108 106 1160 106" pathLength="1" class="draw"/><path d="M1050 210 H1176" pathLength="1" class="draw"/><path d="M1050 210 C1110 210 1108 312 1160 312" pathLength="1" class="draw"/></g>
  <g stroke="url(#beam)" stroke-width="1.6"><path d="M1050 210 C1110 210 1108 106 1160 106" pathLength="1" class="draw"/><path d="M1050 210 H1176" pathLength="1" class="draw"/><path d="M1050 210 C1110 210 1108 312 1160 312" pathLength="1" class="draw"/></g>
</g>
<circle cx="1050" cy="210" r="3.2" fill="#34d399"/>
<circle class="moving" cx="1050" cy="210" r="3" fill="none" stroke="#34d399">
