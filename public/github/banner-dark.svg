  <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="2s" repeatCount="indefinite"/>
</circle>

<g class="up" style="animation-delay: 1.6s" fill="#121215" stroke="rgba(250,250,250,0.5)" stroke-width="1.3">
  <rect x="1160" y="78" width="84" height="56" rx="7"/>
